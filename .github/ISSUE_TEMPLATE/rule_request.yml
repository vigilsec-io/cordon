name: "[RULE-REQUEST] New detection rule"
description: Propose a new security rule for Valca to detect
title: "[RULE-REQUEST] "
labels: ["enhancement", "rule-request"]
body:
  - type: markdown
    attributes:
      value: |
        Open this **before** writing code, so the rule ID and scope can be agreed and numbering stays stable.
  - type: textarea
    id: attack
    attributes:
      label: What is the attack or misconfiguration?
      description: Describe the threat, not just the pattern. What can an attacker actually do?
    validations: {required: true}
  - type: textarea
    id: vulnerable
    attributes:
      label: Vulnerable example
      render: yaml
    validations: {required: true}
  - type: textarea
    id: safe
    attributes:
      label: Safe example, and safe idioms that must NOT be flagged
      description: The patterns that superficially match but are legitimate. This determines whether the rule is usable.
      render: yaml
    validations: {required: true}
  - type: textarea
    id: coverage
    attributes:
      label: Do existing tools catch this?
      description: Checkov, Trivy, Snyk, Semgrep, others. If they do, say what Valca would add.
    validations: {required: true}
  - type: input
    id: reference
    attributes:
      label: Reference
      description: CVE, CWE, advisory, or writeup, if one exists
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      options: [CRITICAL, HIGH, MEDIUM, LOW, INFO]
    validations: {required: true}
