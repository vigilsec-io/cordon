name: Feature request
description: Suggest an improvement to Vigil (not a new rule)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Proposing a new **detection rule**? Use the [RULE-REQUEST] template instead."
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
